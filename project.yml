name: AlarmClockApp
options:
  bundleIdPrefix: com.alfie
  deploymentTarget:
    iOS: "17.0"

targets:
  AlarmClockApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AlarmClockApp.swift
      - ContentView.swift
      - Components
      - Models
      - Services
      - Views
      - Assets.xcassets
      - zh-Hans.lproj
      - en.lproj
      - path: Resources/Sounds
        buildPhase: resources
        includes:
          - "*.caf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfie.AlarmClockApp
        PRODUCT_NAME: "AlarmClockApp"
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.9"
        ALWAYS_SEARCH_USER_PATHS: NO
        DEFINES_MODULE: YES
        ENABLE_TESTABILITY: YES
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: D4SUBHNYW9
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_COMPILATION_MODE: singlefile
          ENABLE_TESTABILITY: YES
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          ENABLE_TESTABILITY: NO
  AlarmClockAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: AlarmClockApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfie.AlarmClockAppTests
        PRODUCT_NAME: "AlarmClockAppTests"
        SWIFT_VERSION: "5.9"
        ALWAYS_SEARCH_USER_PATHS: NO
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AlarmClockApp.app/AlarmClockApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
