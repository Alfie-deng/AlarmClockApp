name: AlarmClockApp
options:
  bundleIdPrefix: com.alfie
  deploymentTarget:
    iOS: "17.0"

targets:
  AlarmClockApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AlarmClockApp.swift
      - ContentView.swift
      - Components
      - Models
      - Services
      - Views
      - Assets.xcassets
      - zh-Hans.lproj
      - en.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfie.AlarmClockApp
        PRODUCT_NAME: "AlarmClockApp"
        SWIFT_VERSION: "5.9"
        ALWAYS_SEARCH_USER_PATHS: NO
        DEFINES_MODULE: YES
        ENABLE_TESTABILITY: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: D4SUBHNYW9
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "挑战闹钟"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于识别你是否念出了起床挑战指定语句。"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于采集念语句挑战的语音。"
        INFOPLIST_KEY_NSCameraUsageDescription: "用于拍摄起床挑战指定目标照片。"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AlarmClockAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: AlarmClockApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alfie.AlarmClockAppTests
        PRODUCT_NAME: "AlarmClockAppTests"
        SWIFT_VERSION: "5.9"
        ALWAYS_SEARCH_USER_PATHS: NO
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AlarmClockApp.app/AlarmClockApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
